<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MargDarshak | Road Intelligence & Municipal Grievance Portal</title>
    <!-- Google Fonts: Inter & Plus Jakarta Sans for authentic GovTech portal typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Tailwind CSS v3 with Forms & Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              govNavy: {
                950: '#06162a',
                900: '#0a2540',
                850: '#0f3154',
                800: '#153e6b',
                700: '#1d518a',
                600: '#2563eb'
              },
              civicSaffron: {
                DEFAULT: '#d97706',
                light: '#fef3c7',
                dark: '#b45309'
              },
              civicEmerald: {
                DEFAULT: '#059669',
                light: '#ecfdf5',
                dark: '#047857'
              },
              civicRed: {
                DEFAULT: '#dc2626',
                light: '#fef2f2',
                dark: '#b91c1c'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
      /* Accessibility Font Scaling Classes */
      html.text-size-sm { font-size: 14px; }
      html.text-size-md { font-size: 16px; }
      html.text-size-lg { font-size: 18px; }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .radar-pulse {
        position: relative;
      }
      .radar-pulse::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        border-radius: 9999px;
        background: rgba(16, 185, 129, 0.4);
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.9); opacity: 0.8; }
        80%, 100% { transform: scale(2.2); opacity: 0; }
      }
      /* Leaflet map styling */
      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col font-sans selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
